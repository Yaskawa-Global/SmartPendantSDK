message Vector { repeated double values = 1; }
message IVector { repeated int64 values = 1; }
message Point { repeated double values = 1; }

message Matrix {
    int64 rows = 1;
    int64 cols = 2;
    repeated Vector m = 3;
}

// Orientations in 3D can be represented either as:
//    * A 4-element unit-length Quaternion (x,y,z,w)
//    * A 3x3 transformation matrix
//    * A 3-vector of Euler angles
//        (Tait/Cardan-Bryant) Roll, Pitch, Yaw angles (alpha,beta,gamma).
//        This is equivelent to EulerXYZ and assumes that the
//         x-axis points forward, y-axis points right and the z-axis up.
//         (Aeronautical convention)
enum OrientationRepresentation {
    OrientationQuaternion = 0;
    OrientationMatrix = 1;
    OrientationEulerrpy = 2;
}

// If rep is Quaternion or EulerRPY then v contains the elements,
// otherwise if rep is Matrix m contains the 3x3 transform
message Orient {
    OrientationRepresentation rep = 1;
    Vector v = 2;
    Matrix m = 3;
}

message VectorOrient {
    Vector v = 1;
    Orient o = 2;
}

// Position and Orientaiton in 3D defined by
// an origin point and two points that define a plane
message PointPlane {
    Point origin = 1;
    Point xx = 2;
    Point xy = 3;
}

message Version {
    int32 nmajor = 1;
    int32 nminor = 2;
    int32 npatch = 3;
    string release = 4;
    string build = 5;
}

enum LoggingLevel {
    Debug = 0;
    Info = 1;
    Warn = 2;
    Critical = 3;
}

// A Coordinate Frame is a reference frame in space
//    against which concrete coordinates are relative.
//
//    In 3D space a frame can be represented by an origin
//    and the direction of the x,y & z axes - explicitly or
//    otherwise.
//
//    * Implicit - the coordinate frame is implicit in its type (e.g. predefined)
//               (e.g. the base frame is relative to the fixed mount of the robot)
//    * Transform - the frame is represented by a standard 4x4 transformation matrix
//    * OffsetOrient - the frame is represented by an origin and orientation in 3D
//    * OriginPlane - the frame is defined by an origin and two additional points making up a plane
enum CoordFrameRepresentation {
     Implicit = 0;
     Transform = 1;
     OffsetOrient = 2;
     OriginPlane = 3;
}


// Type of predefined coordinate frames (representaton is implicit)
//     * Joint - the joint space of the robot (dimension equals the number of axes / dof)
//    * World - Cartesian frame of environment (typically coincident with the robot base)
//    * Base  - Cartesian frame of the base mount of the robot
//              (for robots not mounted on a moveable base, fixed relative to the robot frame)
//    * Robot - Cartesian frame of the robot (e.g. from first axis)
//    * ToolPlate - Cartesian frame of the tool mounting plate
//    * ToolTip - Cartesian frame of the tip of the tool (i.e. End-Effector)
//               (this depends on the specific tool)
//    * User - Cartesian frame configured by user stored in the controller
//             (multiple user frames can be defined and referenced by index)
enum PredefinedCoordFrameType {
     None = 0;
     JointFrame = 1;
     WorldFrame = 2;
     RobotFrame = 3;
     ToolPlateFrame = 4;
     ToolTipFrame = 5;
     UserFrame = 6;
     BaseFrame = 7;
}

message CoordinateFrame {
    CoordFrameRepresentation rep = 1;
    PredefinedCoordFrameType predefined = 2;
    string name = 3;
    int32 robot = 4; // RobotIndex
    int32 tool = 5;  // ToolIndex
    Matrix transform = 6;
    VectorOrient vecorient = 7;
    int32 userFrame = 8; // UserFrameIndex
    PointPlane pointplane = 9;
}

enum DistanceUnit { None_Dist = 0; Millimeter = 1; Inch = 2; Meter = 3; }
enum OrientationUnit { None_Orient = 0; Pulse = 1; Radian = 2; Degree = 3; }

message Position {
    CoordinateFrame frame = 1;
    DistanceUnit distUnit = 2;
    OrientationUnit orientUnit = 3;
    Vector pos = 4;
    Orient orient = 5;
    Vector joints = 6;
    IVector closure = 7;
    Vector redundancy = 8;
}

//Specify how to compute inverse kinematics (via transformPositionToFrame()):
//     Delta: minimize joint coordinate distance between solution and provided Position
//     Closure: try to match solution arm closure with provided Position
//     Default: Use controller default method
//     None: Not applicable/Do nothing
enum InverseKinematicsScheme { None_IK = 0; Default = 1; Delta = 2; Closure = 3; }

message AnyList {
  repeated Any items = 1;
}

message AnyMap {
    map<string, Any> items = 1;
}

message Any {
    oneof value {
        bool bValue = 1;
        int64 iValue = 2;
        double rValue = 3;
        string sValue = 4;
        Vector vValue = 5;
        Position pValue = 6;
        AnyList aValue = 7;
        AnyMap mValue = 8;
    }
}

message LoggingEvent {
    int64 timestamp = 1;   // millisecs since 1970-01-01
    string datetime = 2;   // string representation of timestamp
    LoggingLevel level = 3;
    string entry = 4;
}

//Data structures for passing values to charts for plotting
//
//    Series data is used for line and scatter charts, while
//    category data is used for pie and bar charts
message Series {
    Vector x = 1;
    Vector y = 2;
    Vector z = 3;
    string color = 4;
    string vertex = 5;
    string style = 6;
    bool hidden = 7;
    int32 maxPts = 8;
}

message Category {
    double v = 1;
    string color = 2;
    bool hidden = 3;
}

message DataPoint {
    double x = 1;
    double y = 2;
    double z = 3;
}

message Data {
    oneof value {
        Series sData = 1;
        Category cData = 2;
    }
}

message DataSet { map<string, Data> values = 1; }

// External File Storage: name, location and volume details
// (API version 2.3 and later)
message StorageInfo {
    string path = 1;
    string volname = 2;
    string volsize = 3;
}

