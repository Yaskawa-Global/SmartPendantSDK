import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";


////////////////////////////////////////
//    ----------------------------    //
//    Mapping thrift <-> protoc       //
//    ----------------------------    //
//    i64 -> int64                    //
//    i32 -> int32                    //
//    i16 -> int32                    //
//    string -> string                //
//    list<T> -> repeated T           //
//    map<K,V> -> map<K,V>            //
